name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh bin/dev-agent evals/loop.sh guard/guard.sh verify/run.sh hooks/pre-commit hooks/pre-push scripts/install-hooks.sh scripts/install-gga.sh scripts/review-gga.sh scripts/bootstrap.sh scripts/new-profile.sh scripts/install-agent-adapters.sh scripts/check-techdoc.sh scripts/install-techdoc.sh scripts/doctor.sh
      - name: Python syntax
        run: python3 -m py_compile guard/comment_lint.py evals/harness.py evals/agent_runner.py scripts/validate-profile.py
      - name: Validate profile template
        run: python3 scripts/validate-profile.py profiles/_template
      - name: Eval dry-run
        run: python3 evals/harness.py --case-dir evals/cases/dev-verify/01-fix-failing-test --rubric evals/rubric.dev-verify.json --agent build --dry-run --out /tmp/eval-dry
